name: Lazy Pandas Benchmarks

on:
  push:
    branches: [lazy-pandas]
    paths:
      - "pandas/lazy/**"
      - "pandas/tests/lazy/**"
      - ".github/workflows/lazy-benchmarks.yml"
  workflow_dispatch:
    inputs:
      base_ref:
        description: >-
          Base ref for the A/B regression job (must contain
          pandas/lazy/benchmarks; e.g. a previous lazy-pandas commit).
          Leave empty to skip A/B and run only the smoke job.
        required: false
        default: ""
      threshold:
        description: Regression threshold percentage for the A/B job
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: lazy-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Tests + quick benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use setup-pixi directly rather than ./.github/actions/setup-pixi:
      # the shared action only writes its cache on pushes to main, but this
      # workflow lives on a fork branch (lazy-pandas) that never pushes to
      # main, and forks do not inherit upstream caches - without
      # cache-write here every run would cold-install the environment.
      - name: Create virtual environment with Pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          pixi-version: v0.69.0
          manifest-path: pixi.toml
          environments: py313
          cache: true
          cache-write: ${{ github.event_name == 'push' }}

      - name: Build pandas
        run: |
          pixi run --environment py313 build-pandas --editable

      - name: Run lazy test suite
        run: |
          pixi run --environment py313 python -m pytest pandas/tests/lazy -q

      - name: Run quick benchmark smoke (sort, filter, join, aggregations)
        # Quick mode: ~10x smaller data. No baselines exist on a fresh
        # runner, so baseline_cli records them and passes - this job
        # gates on crashes and correctness, not run-to-run timing.
        working-directory: pandas/lazy/benchmarks
        run: |
          for bench in sort filter join aggregations; do
            pixi run --environment py313 python run_all.py "$bench" --quick
          done

  ab-regression:
    name: A/B regression vs base ref
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.base_ref != ''
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use setup-pixi directly rather than ./.github/actions/setup-pixi:
      # the shared action only writes its cache on pushes to main, but this
      # workflow lives on a fork branch (lazy-pandas) that never pushes to
      # main, and forks do not inherit upstream caches - without
      # cache-write here every run would cold-install the environment.
      - name: Create virtual environment with Pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          pixi-version: v0.69.0
          manifest-path: pixi.toml
          environments: py313
          cache: true
          cache-write: ${{ github.event_name == 'push' }}

      - name: Build pandas at base ref
        run: |
          git checkout ${{ github.event.inputs.base_ref }}
          pixi run --environment py313 build-pandas --editable

      - name: Record baselines at base ref (quick mode)
        working-directory: pandas/lazy/benchmarks
        run: |
          for bench in sort filter join aggregations; do
            pixi run --environment py313 python run_all.py "$bench" \
              --quick --update-baseline
          done

      - name: Rebuild pandas at head
        run: |
          # Baselines live under pandas/lazy/benchmarks/baselines
          # (gitignored), so they survive the checkout.
          git checkout ${{ github.sha }}
          pixi run --environment py313 build-pandas --editable

      - name: Compare head against base baselines
        working-directory: pandas/lazy/benchmarks
        run: |
          for bench in sort filter join aggregations; do
            pixi run --environment py313 python run_all.py "$bench" \
              --quick --threshold ${{ github.event.inputs.threshold }}
          done
